# 构建配置（根据项目类型调整）
[build]
  publish = "build"  # React项目默认构建目录为build
  command = "npm run build"  # 构建命令

# 单页应用路由支持（对应Nginx的try_files $uri $uri/ /index.html;）
[[redirects]]
  from = "/*"         # 匹配所有路径
  to = "/index.html"  # 指向index.html处理路由
  status = 200        # 前端路由重写（不改变URL）

# 缓存策略（对应Nginx的add_header配置）
[[headers]]
  for = "/*"          # 应用于所有文件
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"  # 禁止缓存
    Pragma = "no-cache"
    Expires = "0"

# 接口代理规则
[[redirects]]
  from = "/sfpdf/digitalHeart/saveMessage"
  to = "https://www.heartvoice.com.cn/sfpdf/digitalHeart/saveMessage"
  status = 200       # 保持200状态码（前端无感知转发）
  force = true       # 强制转发，忽略 Netlify 静态资源匹配
  headers = { "X-Forwarded-Proto" = "https" }  # 可选：确保后端识别 HTTPS 协议

# 跨域配置（已有，保留，确保请求带跨域头）
[[headers]]
  for = "/sfpdf/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://www.heartvoice.com.cn"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Max-Age = "3600"