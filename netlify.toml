# 构建配置（根据项目类型调整）
[build]
  publish = "build"  # React项目默认构建目录为build
  command = "npm run build"  # 构建命令

# 单页应用路由支持（对应Nginx的try_files $uri $uri/ /index.html;）
[[redirects]]
  from = "/*"         # 匹配所有路径
  to = "/index.html"  # 指向index.html处理路由
  status = 200        # 前端路由重写（不改变URL）

# 缓存策略（对应Nginx的add_header配置）
[[headers]]
  for = "/*"          # 应用于所有文件
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"  # 禁止缓存
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
from = "/sfpdf/*"  # 匹配前端请求的路径（如 /sfpdf/digitalHeart/saveMessage）
to = "https://www.heartvoice.com.cn/sfpdf/:splat"  # 后端接口地址，:splat 表示转发/sfpdf/后的路径片段
status = 200       # 保持 HTTP 状态码为 200
force = true       # 强制重写，确保所有匹配请求都被转发

# 跨域配置（允许指定域名访问你的资源）
[[headers]]
# 匹配所有API请求路径
for = "/sfpdf/*"
[
headers.values
]
# 允许的请求来源
Access-Control-Allow-Origin = "https://www.heartvoice.com.cn"
# 允许的请求方法
Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
# 允许的请求头
Access-Control-Allow-Headers = "Content-Type, Authorization"
# 允许携带凭证（如Cookie/Token）
Access-Control-Allow-Credentials = "true"
# 预检请求缓存时间（秒）
Access-Control-Max-Age = "3600"