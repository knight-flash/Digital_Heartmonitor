# 构建配置（根据项目类型调整）
[build]
  publish = "build"  # React项目默认构建目录为build
  command = "npm run build"  # 构建命令

# 单页应用路由支持（对应Nginx的try_files $uri $uri/ /index.html;）
[[redirects]]
  from = "/*"         # 匹配所有路径
  to = "/index.html"  # 指向index.html处理路由
  status = 200        # 前端路由重写（不改变URL）

# 缓存策略（对应Nginx的add_header配置）
[[headers]]
  for = "/*"          # 应用于所有文件
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"  # 禁止缓存
    Pragma = "no-cache"
    Expires = "0"

# 接口代理规则
[[redirects]]
  from = "/sfpdf/*"  # 匹配前端请求的路径（如 /sfpdf/digitalHeart/saveMessage）
  to = "https://www.heartvoice.com.cn/sfpdf/:splat"  # 后端接口地址
  status = 200       # 保持HTTP状态码为200
  force = true       # 强制重写

# 跨域配置（允许指定域名访问）
[[headers]]
  for = "/sfpdf/*"  # 匹配所有API请求路径
  [headers.values]  # 修正：这里必须用方括号+点语法，不能换行或用其他括号
    Access-Control-Allow-Origin = "https://www.heartvoice.com.cn"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Max-Age = "3600"